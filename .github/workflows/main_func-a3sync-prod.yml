# Despliegue del conector a3 (carpeta a3sync/) a la Function App func-a3sync-prod (Flex Consumption).
# Solo se lanza cuando cambia a3sync/ o este fichero, o a mano desde Actions.
# Desplegar NO sincroniza: los timers se apagan con AzureWebJobs.<funcion>.Disabled=true en la Function App.

name: Desplegar conector a3 (func-a3sync-prod)

on:
  push:
    branches:
      - 'main'
    paths:
      - 'a3sync/**'
      - '.github/workflows/main_func-a3sync-prod.yml'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'a3sync'
  NODE_VERSION: '24'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Instalar, compilar y probar
        shell: bash
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        run: |
          npm install
          npm test
          npm prune --omit=dev

      - name: Empaquetar
        shell: bash
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        run: zip -r ../release.zip host.json package.json dist node_modules -x 'dist/test/*'

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Descargar artefacto
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login en Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A3AAEFE2CE414E88B261EAC92E26CE30 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_CA286F239E6F42258C700E605274423D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_037C5FE41EEC4E0F9FC58CC817F473E5 }}

      - name: Desplegar en func-a3sync-prod
        uses: Azure/functions-action@v1
        with:
          app-name: 'func-a3sync-prod'
          package: release.zip
